<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的主页</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        overflow: hidden;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #db2777);
      }

      main {
        width: min(90%, 920px);
        padding: clamp(2.5rem, 8vw, 6rem) clamp(1.5rem, 6vw, 5rem);
        text-align: center;
        background: rgb(255 255 255 / 14%);
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 2rem;
        box-shadow: 0 1.5rem 4rem rgb(30 20 80 / 35%);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 5rem);
        line-height: 1.2;
        letter-spacing: -0.04em;
        text-shadow: 0 0.25rem 1rem rgb(30 20 80 / 28%);
      }

      .sparkle {
        display: inline-block;
        margin-bottom: 1.25rem;
        font-size: 2.5rem;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        50% {
          transform: translateY(-0.5rem) rotate(8deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sparkle {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="sparkle" aria-hidden="true">✨</span>
      <h1>你好，欢迎来到我的主页！</h1>
    </main>
  </body>
</html>
